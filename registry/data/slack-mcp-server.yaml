name: Slack MCP Server
slug: slack-mcp-server
type: mcp-server
summary: Feature-rich community MCP server for Slack workspaces, supporting stealth (no bot install) and OAuth modes.
description: Supports Stdio, SSE, and HTTP transports, channel/thread history by date or message count, unread-message triage, and message search across DMs and channels. Can run without installing a Slack app via a stealth-token mode, or with standard OAuth bot/user tokens.
repo_url: https://github.com/korotovsky/slack-mcp-server
docs_url: https://github.com/korotovsky/slack-mcp-server/blob/master/docs/02-installation.md
install: "npx -y slack-mcp-server@latest --transport stdio"
license: MIT
maintainer: korotovsky (community)
tags: [slack, chat, messaging]
added_by: nex9-agent
added_date: "2026-08-23"
last_verified: "2026-08-23"
verified_by: nex9-agent
notes: Anthropic's original reference Slack server is archived and unmaintained; this community server is the actively maintained option. Not an official Slack product.
