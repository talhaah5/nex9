name: Sentry MCP
slug: sentry-mcp
type: mcp-server
summary: Sentry's official remote MCP server for triaging errors, issues, and performance data from a coding agent.
description: Middleware over the Sentry API tuned for human-in-the-loop coding assistants such as Claude Code and Cursor, exposing tools to search issues, inspect traces, and pull performance data. Available as a hosted remote server, or a self-hosted stdio server for self-hosted Sentry.
repo_url: https://github.com/getsentry/sentry-mcp
docs_url: https://mcp.sentry.dev
install: "claude plugin marketplace add getsentry/sentry-mcp && claude plugin install sentry-mcp@sentry-mcp"
license: unknown
maintainer: Sentry
