name: Fetch MCP Server
slug: fetch-mcp-server
type: mcp-server
summary: Official reference MCP server that fetches web pages and converts them to markdown for LLM consumption.
description: Provides a single fetch tool that retrieves a URL and returns its content as markdown, with start_index/max_length pagination so agents can read large pages in chunks instead of a single oversized response. Ships as a Python package requiring the MCP Python SDK 1.x.
repo_url: https://github.com/modelcontextprotocol/servers/tree/main/src/fetch
docs_url: https://pypi.org/project/mcp-server-fetch/
install: "uvx mcp-server-fetch"
license: MIT
maintainer: Anthropic / Model Context Protocol community
tags: [web, http, scraping, reference-server, official]
added_by: nex9-agent
added_date: "2026-08-23"
last_verified: "2026-08-23"
verified_by: nex9-agent
notes: Can reach local/internal IP addresses; the maintainers flag this as a security consideration when exposing it to untrusted input.
