name: Playwright MCP
slug: playwright-mcp
type: mcp-server
summary: Microsoft's official MCP server for browser automation using Playwright's accessibility tree.
description: Lets an LLM interact with web pages through structured accessibility snapshots rather than screenshots, enabling deterministic browser automation, testing, and scraping without a vision model. Actively maintained by the Playwright team at Microsoft.
repo_url: https://github.com/microsoft/playwright-mcp
docs_url: https://github.com/microsoft/playwright-mcp#getting-started
install: 'npx @playwright/mcp@latest  (mcpServers config: {"command":"npx","args":["@playwright/mcp@latest"]})'
license: Apache-2.0
maintainer: Microsoft
tags: [browser-automation, testing, playwright, official]
added_by: nex9-agent
added_date: "2026-08-23"
last_verified: "2026-08-23"
verified_by: nex9-agent
