name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No external CDN / script dependencies in HTML
        run: |
          set -e
          # Every <script src=...> and <link rel="stylesheet" href=...> must be a
          # site-relative path (starts with "/"), never http(s):// — this is the
          # site's core "zero external dependencies" guarantee, enforced by CI
          # instead of just documented in AGENTS.md.
          if grep -RnoE '<(script src|link[^>]+rel="stylesheet"[^>]+href)="https?://' --include='*.html' .; then
            echo "::error::Found an external script/stylesheet reference. This site must be 100% self-contained."
            exit 1
          fi
          echo "OK: no external CDN references found"

      - name: No broken internal links
        run: |
          set -e
          # Every site-relative href must resolve to a file that exists. This is what
          # catches a page being moved or removed without its inbound links being
          # updated — the failure mode that produced dead /foundry/ links across the
          # whole site when that section was deleted.
          fail=0
          while IFS= read -r line; do
            src="${line%%:*}"
            href="${line#*:}"
            path="${href%%#*}"          # drop fragment
            [ -z "$path" ] && continue  # pure anchor, same page
            case "$path" in
              */) target=".${path}index.html" ;;
              *)  target=".${path}" ;;
            esac
            if [ ! -e "$target" ]; then
              echo "::error file=$src::broken internal link '$href' -> $target does not exist"
              fail=1
            fi
          done <<< "$(grep -rhoE 'href="/[^"]*"' --include='*.html' . \
                      | sed 's/href="//; s/"$//' \
                      | sort -u \
                      | while read -r h; do
                          echo "$(grep -rl "href=\"$h\"" --include='*.html' . | head -1):$h"
                        done)"
          [ "$fail" -eq 0 ] && echo "OK: all internal links resolve"
          exit "$fail"

  coordinator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]" pytest-cov

      - name: Trust logic tests
        # These cover manifest signing, the ingest schema boundary, and the
        # global per-target rate ceiling. The ceiling in particular is what
        # keeps the swarm from being usable as a DoS tool, so a red suite here
        # blocks the merge rather than warning about it.
        run: pytest --cov=vantage --cov-report=term-missing --cov-fail-under=80
