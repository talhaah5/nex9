[project]
name = "vantage-coordinator"
version = "0.1.0"
description = "Coordinator and ingest API for Vantage — an internet observatory measured by an agent swarm"
# No `readme` key: it lives at the repo root, and setuptools refuses to read a
# file outside the project directory. See `project.urls` for the docs.
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://nex9.de"
Source = "https://github.com/talhaah5/nex9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vantage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -q keeps CI output readable; the trust-logic suite is the interesting signal,
# not a per-test transcript.
addopts = "-q"
